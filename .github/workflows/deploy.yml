# Cloudflare Workers 部署流水线
#
# 需要配置的仓库 Secrets（Settings → Secrets and variables → Actions）：
#   CLOUDFLARE_API_TOKEN   Workers Scripts:Edit + D1:Edit + R2:Edit + Queues:Edit 权限
#   CLOUDFLARE_ACCOUNT_ID  账号 ID
#
# 运行期密钥（JWT_SECRET / TURNSTILE_SECRET_KEY / RESEND_API_KEY）**不放在这里**，
# 用 `wrangler secret put` 写一次即可，之后每次部署都会保留。放进 CI 只会增加泄露面。
#
# 数据库迁移默认不自动执行：D1 的 ALTER TABLE 不支持 IF NOT EXISTS，
# 重复执行会报 duplicate column，自动跑有把生产库改坏的风险。
# 需要时手动触发 workflow 并勾选 apply_migrations。

name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      apply_migrations:
        description: '执行未应用的 D1 迁移（谨慎，只能跑一次）'
        type: boolean
        default: false

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 静态检查与测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      # 语法 / import / 内联脚本静态检查 + 打包 dry-run
      - name: Check
        run: npm run check -- --build

      - name: i18n 单元测试
        run: npm run test:i18n

  deploy:
    name: 部署
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: 检查必需的 Secrets
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then
            echo "::error::缺少 CLOUDFLARE_API_TOKEN 或 CLOUDFLARE_ACCOUNT_ID"
            exit 1
          fi

      - name: 校验 wrangler 配置里的占位符
        run: |
          if grep -q "REPLACE_WITH_YOUR_D1_ID" wrangler.toml; then
            echo "::error::wrangler.toml 里 database_id 仍是占位符，请先填真实 D1 ID"
            exit 1
          fi
          if grep -q "REPLACE_WITH_YOUR_KV_ID" wrangler.toml; then
            echo "::error::wrangler.toml 里 KV id 仍是占位符"
            exit 1
          fi
          if grep -q "REPLACE_WITH_HTTPS_YOUR_DOMAIN" wrangler.toml; then
            echo "::warning::SITE_URL 仍是占位符 —— canonical / sitemap / hreflang 会指向错误域名"
          fi

      - name: 执行 D1 迁移（手动触发且勾选时）
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.apply_migrations }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          echo "按顺序执行增量迁移（已执行过的会报 duplicate column，属预期）"
          for f in schema/migrations/*.sql; do
            echo "--- $f"
            npx wrangler d1 execute b2b_database --remote --file="$f" --yes || true
          done

      - name: 部署 Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      # 只打公开首页，非致命：自定义域尚未绑定 / 本机网络拦截 workers.dev 时只给警告。
      # 可用仓库变量 HEALTH_URL 覆盖（Settings → Secrets and variables → Actions → Variables）。
      - name: 部署后健康检查（公开页）
        env:
          HEALTH_URL: ${{ vars.HEALTH_URL || 'https://cf-b2b-pro.talunte28.workers.dev' }}
        run: |
          code=000
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$HEALTH_URL/" || echo 000)
            [ "$code" = "200" ] && break
            sleep 10
          done
          if [ "$code" = "200" ]; then
            echo "首页健康检查通过：$HEALTH_URL"
          else
            echo "::warning::首页暂不可达（HTTP $code）—— 自定义域名需先在 Cloudflare 绑定；部分网络会拦截 workers.dev"
          fi

      - name: 输出部署摘要
        run: |
          echo "### 部署完成" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- 部署后请执行 \`bash scripts/smoke-test.sh <站点地址>\` 做冒烟验证" >> $GITHUB_STEP_SUMMARY
